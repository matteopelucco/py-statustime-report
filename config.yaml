# Configurazione del motore. Tutte le regole di business stanno QUI, non nel codice.
project_name: ""          # nome del progetto nel titolo del report (vuoto = solo "Flow report")
powered_by: ""   # firma nel piè di pagina (vuoto = nessuna)


# --- Export Status Time Free (stesso formato, stessa query). Sovrascrivibili con --input-completed / --input-all.
# issue entrate in Done nel periodo: lead time, cycle time, deployments
input_completed: data/completed.csv
# TUTTE le issue del periodo, aperte comprese: backlog corretto e confronto fra i due export. Facoltativo: vuoto = backlog solo dalle consegne (sottostimato)
input_all: data/all.csv
# -----------------------------------------------------------------------------------------------------

output_dir: out
# Link di dettaglio della issue nel report: ${issueKey} viene sostituito con la key (es. PROJ-123). Vuoto = nessun link.
issue_url: "https://jira.example.com/browse/${issueKey}"

# Chiusura = ingresso in questo stato (Done = in produzione, per convenzione: adattare al proprio flusso)
done_status: Done
# Se un item ha piu' ingressi in Done: "last" (ultimo) oppure "first" (primo)
done_pick: last
# Giorni con piu' di N ingressi in Done = migrazione/bonifica di massa, ignorati (scegliere una soglia ben oltre i rilasci normali)
bulk_done_threshold: 300

# Periodo di estrazione dell'export (item entrati in Done in questo intervallo). Le consegne fuori periodo sono
# escluse (es. item rientrati in Done solo per una bonifica) e nessun mese precedente appare nel trend.
period_start: 2026-01-01
# DEVE coincidere con la fine delle query Jira: l'export completo contiene anche le consegne successive (es. ottobre),
# quello delle consegne no -> senza period_end il mese in corso e' conteggiato a meta'.
period_end: 2026-06-30    # facoltativo; di default = oggi

# Filtri
# Tipi che non sono consegne ne' lavoro (es. record dei casi di test)
exclude_issue_types: [Epic, Sub-task]
include_resolutions: [Done, Fixed, Resolved, Answered]   # le altre (Won't Do, Duplicate...) sono scartate
# Valori "di default" di Jira (Resolution mai impostata): valgono come consegnati SOLO se lo Status e' done_status
default_resolutions: [Unresolved, Open]

# Stati "coda" (non lavorati) -> backlog; "attesa rilascio"; il resto e' WIP
queue_statuses: [To Do, Open, Backlog]
closed_statuses: [Done, Closed]
# Stati di attesa rilascio (lavoro finito, in coda per UAT/produzione): fase separata da "lavoro" nella tabella issue
release_wait_statuses: [Ready for Release]

# Classi di lavoro: la prima regola che combacia vince. Campi: issue_types, summary_regex
classes:
  # Expedite = label Jira "Expedite" (serve la colonna Labels nell'export; senza, la classe resta vuota; maiuscole ignorate)
  - name: Expedite
    labels: [Expedite]
  - name: Bug
    issue_types: [Bug]
  # Story con Epic Link valorizzato vs senza (servono le colonne Epic Link; senza, restano tutte "Story (senza Epic)")
  - name: Story (con Epic)
    issue_types: [Story]
    filled_fields: [Epic Link]
  - name: Story (senza Epic)
    issue_types: [Story]
  - name: Task
    issue_types: [Task]
  - name: Altro          # stesso nome della classe di ripiego per gli item senza regola: confluiscono insieme
    issue_types: [Analysis]
  # altra regola disponibile: summary_regex: "(?i)regex sul titolo"

# Righe mostrate nelle tabelle di lead time e cycle time (+ "Tutti" = tutti gli item validi, anche Task e Altro)
report_classes: [Bug, Expedite, Story (senza Epic)]
# Cycle time = dal primo ingresso in questo stato alla produzione (item che salta la coda)
cycle_start_status: In Progress

# Finestre di analisi (mesi indietro da oggi) e soglie "entro N giorni"
windows_months: [3, 6]
percentiles: [50, 85, 95]
within_days: [7, 14, 30, 60]
min_samples: 8        # sotto questa soglia la stima e' marcata "poco affidabile"
trend_months: 6

# Sintesi: confronto degli ultimi N giorni con lo storico (consegne dall'inizio periodo a max(recent_days) giorni fa)
recent_days: [30, 60]
trend_tolerance: 0.10   # variazioni entro +/-10% = "stabile"

# KPI in testa ai tab Issue, Lead time / Cycle time, Backlog, Deployments:
# ultimi kpi_months mesi (fino all'ultimo dato) contro i kpi_prev_months precedenti (6 mesi di misurazione in totale).
# I due periodi durano diverso: conteggi (consegne, deployments) confrontati come ritmo a settimana; % e stati a fine periodo non risentono della durata.
kpi_months: 2
kpi_prev_months: 4
kpi_within_days: [7, 14, 30, 60]   # KPI lead/cycle time = % di item consegnati entro N giorni (un tab per valore)
kpi_default_days: 14               # tab aperto all'avvio
kpi_classes: [Bug, Expedite, Story (senza Epic), Altro]   # + Tutti
kpi_tolerance_pp: 5     # variazione della % entro +/-5 punti = "stabile"

# Anomalie nella tabella issue: fase oltre questi percentili della propria classe (intero periodo) = giallo / rosso
anomaly_percentiles: [85, 95]
anomaly_min_days: 1     # sotto 1 giorno non e' mai anomalia
